name: factcheck_ai
description: "FactCheck AI - AI-Powered Fake News Detection, Misinformation Verification & AI Assistant Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Routing & Navigation
  go_router: ^14.8.0
  
  # Networking & HTTP
  dio: ^5.8.0+1
  socket_io_client: ^3.0.2
  
  # Storage & Preferences
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  
  # UI & Design System
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  font_awesome_flutter: ^10.8.0
  intl: ^0.20.2
  flutter_markdown: ^0.7.6+1
  
  # Device Capabilities
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.0
  local_auth: ^2.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
